<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>📈 Interactive S&P‑500 Mini‑Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ----- CSS (in‑page) ----- -->
    <style>
        :root {
            --bg-light: #fafafa;
            --bg-dark:  #1e1e1e;
            --txt-light: #222;
            --txt-dark:  #eee;
            --accent: #0066cc;
        }
        body {
            margin: 0;
            font-family: system-ui, Arial, Helvetica, sans-serif;
            background: var(--bg-light);
            color: var(--txt-light);
            transition: background .3s, color .3s;
        }
        .dark body { background: var(--bg-dark); color: var(--txt-dark); }
        header { padding: 1rem 2rem; background: var(--accent); color: white; }
        header h1 { margin: 0; font-size: 1.4rem; }
        .container { padding: 1rem 2rem; max-width: 960px; margin: auto; }
        .flex { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
        .flex > * { flex: 1 1 200px; }
        input[type="text"] { width: 100%; padding: .5rem; font-size: 1rem; }
        button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: .5rem; border-bottom: 1px solid #ccc; text-align: left; }
        th { cursor: pointer; background: #f0f0f0; }
        .dark th { background: #333; }
        .theme-toggle { background: none; border: none; color: inherit; font-size: 1.2rem; }
        canvas { max-width: 100%; height: auto; margin-top: 1rem; }
        .error { color: #c00; margin-top: .5rem; }
        @media (max-width:600px){
            header h1{font-size:1.2rem;}
        }
    </style>

    <!-- ----- Chart.js (CDN) ----- -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
<header class="flex">
    <h1>📈 S&P‑500 Mini‑Dashboard</h1>
    <button class="theme-toggle" title="Toggle light/dark mode">🌙</button>
</header>

<div class="container">
    <!-- ----- Controls ----- -->
    <div class="flex">
        <input type="text" id="tickerInput" placeholder="Enter ticker (e.g. AAPL)" autocomplete="off">
        <button id="lookupBtn">Lookup</button>
    </div>
    <div id="errorMsg" class="error"></div>

    <!-- ----- Summary Table ----- -->
    <table id="summaryTable">
        <thead>
            <tr>
                <th data-key="symbol">Ticker</th>
                <th data-key="price">Price (USD)</th>
                <th data-key="high">Day High</th>
                <th data-key="low">Day Low</th>
                <th data-key="change">Change %</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- ----- Chart Container ----- -->
    <canvas id="priceChart"></canvas>
</div>

<!-- ----- JavaScript (in‑page) ----- -->
<script>
(() => {
    // ---------- Config ----------
    const API_KEY = 'YOUR_API_KEY_HERE'; // <-- replace with your Alpha Vantage key
    const BASE_URL = 'https://www.alphavantage.co/query?';
    const tickerInput = document.getElementById('tickerInput');
    const lookupBtn   = document.getElementById('lookupBtn');
    const errorMsg    = document.getElementById('errorMsg');
    const tableBody   = document.querySelector('#summaryTable tbody');
    const chartCanvas = document.getElementById('priceChart');
    let priceChart = null;
    let sortState = { key: null, asc: true };

    // ---------- Helper: fetch JSON ----------
    async function fetchJSON(url) {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('Network error');
        return await resp.json();
    }

    // ---------- API Calls ----------
    async function getIntraday(symbol) {
        const url = `${BASE_URL}function=TIME_SERIES_INTRADAY&symbol=${symbol}&interval=60min&apikey=${API_KEY}&outputsize=compact`;
        const data = await fetchJSON(url);
        if (data['Error Message']) throw new Error('Invalid symbol');
        const series = data['Time Series (60min)'];
        const latest = Object.entries(series)[0][1];
        return {
            price: parseFloat(latest['4. close']),
            high : parseFloat(latest['2. high']),
            low  : parseFloat(latest['3. low']),
            change: ((parseFloat(latest['4. close']) - parseFloat(Object.entries(series).pop()[1]['4. close'])) / parseFloat(Object.entries(series).pop()[1]['4. close'])) * 100
        };
    }

    async function getHistorical(symbol) {
        const url = `${BASE_URL}function=TIME_SERIES_DAILY_ADJUSTED&symbol=${symbol}&apikey=${API_KEY}&outputsize=compact`;
        const data = await fetchJSON(url);
        if (data['Error Message']) throw new Error('Invalid symbol');
        const series = data['Time Series (Daily)'];
        const dates = Object.keys(series).slice(0,30).reverse(); // last 30 days
        const prices = dates.map(d => parseFloat(series[d]['4. close']));
        return { dates, prices };
    }

    // ---------- UI Updates ----------
    function renderRow(symbol, quote) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${symbol}</td>
            <td>${quote.price.toFixed(2)}</td>
            <td>${quote.high.toFixed(2)}</td>
            <td>${quote.low.toFixed(2)}</td>
            <td style="color:${quote.change>=0?'green':'red'}">
                ${quote.change.toFixed(2)}%
            </td>
        `;
        tableBody.appendChild(tr);
    }

    function clearTable() { tableBody.innerHTML = ''; }

    function showError(msg) {
        errorMsg.textContent = msg;
        setTimeout(() => errorMsg.textContent = '', 4000);
    }

    function updateChart(dates, prices, symbol) {
        if (priceChart) priceChart.destroy();
        priceChart = new Chart(chartCanvas, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [{
                    label: `${symbol} – Last 30 Days`,
                    data: prices,
                    borderColor: '#0066cc',
                    backgroundColor: 'rgba(0,102,204,0.1)',
                    tension: 0.2,
                    fill: true,
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: { display: false },
                    y: { beginAtZero: false }
                }
            }
        });
    }

    // ---------- Sorting ----------
    function sortTable(key) {
        const rows = Array.from(tableBody.querySelectorAll('tr'));
        const asc = sortState.key === key ? !sortState.asc : true; // toggle if same column
        rows.sort((a, b) => {
            const aVal = a.querySelector(`td:nth-child(${key+1})`).textContent.trim();
            const bVal = b.querySelector(`td:nth-child(${key+1})`).textContent.trim();
            const numA = parseFloat(aVal.replace('%',''));
            const numB = parseFloat(bVal.replace('%',''));
            const compare = isNaN(numA) ? aVal.localeCompare(bVal) : numA - numB;
            return asc ? compare : -compare;
        });
        tableBody.innerHTML = '';
        rows.forEach(r => tableBody.appendChild(r));
        sortState = { key, asc };
    }

    // ---------- Theme Toggle ----------
    const themeBtn = document.querySelector('.theme-toggle');
    function setTheme(dark) {
        document.documentElement.classList.toggle('dark', dark);
        themeBtn.textContent = dark ? '☀️' : '🌙';
    }
    themeBtn.addEventListener('click', () => setTheme(!document.documentElement.classList.contains('dark')));
    // initialise with system preference
    setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);

    // ---------- Event Listeners ----------
    lookupBtn.addEventListener('click', async () => {
        const symbol = tickerInput.value.trim().toUpperCase();
        if (!symbol) return;
        try {
            const quote = await getIntraday(symbol);
            clearTable();
            renderRow(symbol, quote);
            const hist = await getHistorical(symbol);
            updateChart(hist.dates, hist.prices, symbol);
        } catch (e) {
            showError(e.message);
        }
    });

    // press Enter in input triggers the lookup
    tickerInput.addEventListener('keyup', e => { if (e.key === 'Enter') lookupBtn.click(); });

    // make table headers sortable
    document.querySelectorAll('#summaryTable th').forEach((th, idx) => {
        th.addEventListener('click', () => sortTable(idx));
    });

})();
</script>
</body>
</html>
