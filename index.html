<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Portal | Ling-2.6-1T</title>
    <style>
        /* --- CSS Variables for Theming --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.4);
            --success: #00ff88;
            --danger: #ff3366;
            --border: #333333;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .light-mode {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --accent: #0077cc;
            --accent-glow: rgba(0, 119, 204, 0.2);
            --border: #e0e0e0;
        }

        /* --- Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Particle Canvas --- */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.6;
        }

        /* --- Layout & Header --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* --- Widget Styling --- */
        .widget {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .widget:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h2 {
            margin-bottom: 20px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- Clock Styling --- */
        #clock-display {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-align: center;
            color: var(--text-primary);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        #date-display {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* --- Todo List Styling --- */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-theme {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent);
            animation: fadeIn 0.3s ease;
        }

        li:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        li.completed {
            opacity: 0.5;
            border-left-color: var(--success);
        }

        li.completed span {
            text-decoration: line-through;
        }

        li button {
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        /* --- Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Interactive Grid --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Canvas for Background Particles -->
    <canvas id="particle-canvas"></canvas>

    <div class="container">
        <header>
            <h1>Ling-2.6-1T Portal</h1>
            <div class="controls">
                <span id="connection-indicator" style="color: var(--success); font-size: 0.9rem;">● Online</span>
                <button class="btn-theme" onclick="toggleTheme()" title="Toggle Theme">
                    🌗 Toggle Theme
                </button>
            </div>
        </header>

        <div class="grid-container">
            <!-- Widget 1: Digital Clock -->
            <div class="widget">
                <h2>⏱ Real-Time Clock</h2>
                <div id="clock-display">00:00:00</div>
                <div id="date-display">Loading...</div>
                <p style="margin-top: 15px; color: var(--text-secondary); font-size: 0.9rem;">
                    This clock updates in real-time. It demonstrates DOM manipulation using JavaScript <code>setInterval</code>.
                </p>
            </div>

            <!-- Widget 2: Interactive To-Do List -->
            <div class="widget">
                <h2>📝 Interactive Task Manager</h2>
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="Add a new task..." onkeypress="handleKeyPress(event)">
                    <button class="btn-primary" onclick="addTask()">➕ Add</button>
                </div>
                <ul id="taskList">
                    <!-- Tasks will be injected here -->
                    <li><span>Sample Task</span><button class="btn-danger" onclick="removeTask(this)">Delete</button></li>
                </ul>
            </div>
        </div>

        <footer>
            <p>Built with HTML, CSS & Vanilla JavaScript | Date: <span id="buildDate"></span></p>
        </footer>
    </div>

    <script>
        /* ======================================
           1. PARTICLE BACKGROUND SYSTEM (Canvas)
           ====================================== */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray;

        // Set canvas size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Handle window resize
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        // Mouse object for interaction
        let mouse = {
            x: null,
            y: null,
            radius: 100
        };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        // Particle Class
        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                // Bounce off edges
                if (this.x > canvas.width || this.x < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.directionY = -this.directionY;
                }

                // Mouse collision detection
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < mouse.radius + this.size) {
                    if (mouse.x < this.x && this.x < canvas.width - this.size * 10) {
                        this.x += 10;
                    }
                    if (mouse.x > this.x && this.x > this.size * 10) {
                        this.x -= 10;
                    }
                    if (mouse.y < this.y && this.y < canvas.height - this.size * 10) {
                        this.y += 10;
                    }
                    if (mouse.y > this.y && this.y > this.size * 10) {
                        this.y -= 10;
                    }
                }

                // Move particle
                this.x += this.directionX;
                this.y += this.directionY;

                this.draw();
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 5) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 0.4) - 0.2;
                let directionY = (Math.random() * 0.4) - 0.2;
                let color = 'rgba(0, 212, 255, 0.8)';

                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        function animateParticles() {
            requestAnimationFrame(animateParticles);
            ctx.clearRect(0, 0, innerWidth, innerHeight);

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            
            // Draw connections
            connectParticles();
        }

        function connectParticles() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                                 + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    if (distance < (canvas.width / 7) * (canvas.height / 7)) {
                        opacityValue = 1 - (distance / 20000);
                        ctx.strokeStyle = 'rgba(0, 212, 255,' + opacityValue + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Initialize Canvas
        initParticles();
        animateParticles();

        /* ======================================
           2. CLOCK SYSTEM
           ====================================== */
        function updateClock() {
            const now = new Date();
            
            // Format time
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock-display').textContent = `${hours}:${minutes}:${seconds}`;

            // Format date
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', options);
        }

        // Update clock immediately and every second
        updateClock();
        setInterval(updateClock, 1000);

        /* ======================================
           3. THEME SYSTEM
           ====================================== */
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            // Re-initialize particles to change color dynamically if needed
            // (Currently keeping blue for consistency, but logic could be added here)
            initParticles();
        }

        /* ======================================
           4. TODO LIST SYSTEM
           ====================================== */
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addTask();
            }
        }

        function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText === "") return;

            const li = document.createElement('li');
            
            const span = document.createElement('span');
            span.textContent = taskText;
            span.onclick = function() {
                li.classList.toggle('completed');
            };

            const btnDelete = document.createElement('button');
            btnDelete.className = 'btn-danger';
            btnDelete.textContent = '🗑 Delete';
            btnDelete.onclick = function() {
                li.style.animation = 'none';
                li.style.opacity = '0';
                setTimeout(() => li.remove(), 300);
            };

            li.appendChild(span);
            li.appendChild(btnDelete);
            taskList.appendChild(li);
            
            taskInput.value = '';
            taskInput.focus();
        }

        /* ======================================
           5. MISC UTILITIES
           ====================================== */
        // Set build date in footer
        document.getElementById('buildDate').textContent = new Date().toLocaleDateString();

        // Simulate connection check (just for UI effect)
        setInterval(() => {
            const indicator = document.getElementById('connection-indicator');
            indicator.textContent = Math.random() > 0.1 ? '● Online' : '○ Connecting...';
            indicator.style.color = Math.random() > 0.1 ? 'var(--success)' : 'var(--danger)';
        }, 3000);

    </script>
</body>
</html>
