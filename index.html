
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Todo List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }

        header {
            background: #4a6cf7;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .stats {
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
        }

        .input-section {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #task-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        #task-input:focus {
            border-color: #4a6cf7;
            outline: none;
        }

        #add-btn {
            background: #4a6cf7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        #add-btn:hover {
            background: #3a5ce4;
        }

        .controls {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filters button {
            background: #f5f5f5;
            border: none;
            padding: 8px 15px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filters button.active {
            background: #4a6cf7;
            color: white;
        }

        #clear-completed {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #clear-completed:hover {
            background: #ff5252;
        }

        .todo-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
            font-size: 1rem;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px 10px;
            transition: color 0.3s;
        }

        .delete-btn:hover {
            color: #ff5252;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        footer {
            background: #f8f9fa;
            padding: 15px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Todo List</h1>
            <div class="stats">
                <span id="total-tasks">0 tasks</span>
            </div>
        </header>

        <div class="input-section">
            <div class="input-container">
                <input type="text" id="task-input" placeholder="What needs to be done?">
                <button id="add-btn">Add Task</button>
            </div>
        </div>

        <div class="controls">
            <div class="filters">
                <button class="active" data-filter="all">All</button>
                <button data-filter="active">Active</button>
                <button data-filter="completed">Completed</button>
            </div>
            <button id="clear-completed">Clear Completed</button>
        </div>

        <div class="todo-list" id="todo-list">
            <div class="empty-state" id="empty-state">
                <h3>No tasks yet!</h3>
                <p>Add a task above to get started.</p>
            </div>
        </div>

        <footer>
            Built with HTML, CSS & JavaScript
        </footer>
    </div>

    <script>
        // DOM Elements
        const taskInput = document.getElementById('task-input');
        const addBtn = document.getElementById('add-btn');
        const todoList = document.getElementById('todo-list');
        const emptyState = document.getElementById('empty-state');
        const totalTasksSpan = document.getElementById('total-tasks');
        const filterButtons = document.querySelectorAll('.filters button');
        const clearCompletedBtn = document.getElementById('clear-completed');

        // State
        let todos = JSON.parse(localStorage.getItem('todos')) || [];
        let currentFilter = 'all';

        // Initialize
        renderTodos();
        updateStats();

        // Event Listeners
        addBtn.addEventListener('click', addTodo);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderTodos();
            });
        });

        clearCompletedBtn.addEventListener('click', clearCompleted);

        // Functions
        function addTodo() {
            const text = taskInput.value.trim();
            if (text) {
                const todo = {
                    id: Date.now(),
                    text,
                    completed: false
                };
                todos.push(todo);
                saveToLocalStorage();
                renderTodos();
                updateStats();
                taskInput.value = '';
                taskInput.focus();
            }
        }

        function toggleTodo(id) {
            todos = todos.map(todo => 
                todo.id === id ? {...todo, completed: !todo.completed} : todo
            );
            saveToLocalStorage();
            renderTodos();
            updateStats();
        }

        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveToLocalStorage();
            renderTodos();
            updateStats();
        }

        function clearCompleted() {
            todos = todos.filter(todo => !todo.completed);
            saveToLocalStorage();
            renderTodos();
            updateStats();
        }

        function renderTodos() {
            const filteredTodos = todos.filter(todo => {
                if (currentFilter === 'active') return !todo.completed;
                if (currentFilter === 'completed') return todo.completed;
                return true;
            });

            if (filteredTodos.length === 0) {
                todoList.innerHTML = `
                    <div class="empty-state" id="empty-state">
                        <h3>No ${currentFilter !== 'all' ? currentFilter : ''} tasks!</h3>
                        <p>${currentFilter === 'all' ? 'Add a task above to get started.' : 'Try a different filter.'}</p>
                    </div>
                `;
            } else {
                todoList.innerHTML = filteredTodos.map(todo => `
                    <div class="todo-item ${todo.completed ? 'completed' : ''}">
                        <input type="checkbox" class="todo-checkbox" 
                               ${todo.completed ? 'checked' : ''} 
                               onchange="toggleTodo(${todo.id})">
                        <span class="task-text">${todo.text}</span>
                        <button class="delete-btn" onclick="deleteTodo(${todo.id})">
                            ✕
                        </button>
                    </div>
                `).join('');
            }
        }

        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            totalTasksSpan.textContent = `${total} task${total !== 1 ? 's' : ''} (${completed} completed)`;
        }

        function saveToLocalStorage() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }
    </script>
</body>
</html>
