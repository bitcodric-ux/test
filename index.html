<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Joyful Playground 🌈</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* --------------------------------------------------------------
   Global reset & variables – joyful color palette
   -------------------------------------------------------------- */
:root {
    --bg-primary: #fdf6e3;
    --bg-accent: #fff8e1;
    --text-primary: #2e3440;
    --text-muted: #5e81ac;
    --accent-1: #a3be8c;
    --accent-2: #ebcb8b;
    --accent-3: #bf616a;
    --shadow: rgba(0,0,0,0.12);
    --radius: .6rem;
    --transition: .3s ease;
    --font-main: 'Helvetica Neue', Arial, sans-serif;
}
*,
*::before,
*::after { box-sizing: border-box; margin:0; padding:0; }
html { scroll-behavior: smooth; }
body {
    font-family: var(--font-main);
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
h1, h2 { margin-bottom: .5rem; }
p { margin-bottom: 1rem; }

/* --------------------------------------------------------------
   Layout – centered card with breathing space
   -------------------------------------------------------------- */
.container {
    max-width: 960px;
    margin: 2rem auto;
    padding: 1.5rem;
    background: var(--bg-accent);
    border-radius: var(--radius);
    box-shadow: 0 4px 12px var(--shadow);
}
header { text-align: center; margin-bottom: 2rem; }
header h1 { font-size: 2.5rem; color: var(--accent-1); }
header p { color: var(--text-muted); }

/* --------------------------------------------------------------
   Interactive widgets
   -------------------------------------------------------------- */
.button {
    display: inline-block;
    padding: .6rem 1.2rem;
    margin: .4rem;
    background: var(--accent-2);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-weight: 600;
    transition: var(--transition);
}
.button:hover,
.button:focus { background: var(--accent-3); outline: none; }

.toggle {
    position: relative;
    width: 60px;
    height: 34px;
}
.toggle input {
    opacity: 0;
    width: 0;
    height: 0;
}
.slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: var(--accent-1);
    border-radius: 34px;
    transition: var(--transition);
}
.slider::before {
    content:"";
    position: absolute;
    height: 26px;
    width: 26px;
    left:4px;
    bottom:4px;
    background:#fff;
    border-radius:50%;
    transition: var(--transition);
}
input:checked + .slider {
    background: var(--accent-3);
}
input:checked + .slider::before {
    transform: translateX(26px);
}

/* --------------------------------------------------------------
   Card grid – each card reacts to hover/focus
   -------------------------------------------------------------- */
.grid {
    display: grid;
    gap: 1.2rem;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
}
.card {
    background:#fff;
    border-radius: var(--radius);
    padding:1rem;
    box-shadow:0 2px 6px var(--shadow);
    transition: var(--transition);
    cursor:pointer;
}
.card:hover,
.card:focus-within {
    transform:translateY(-4px);
    box-shadow:0 6px 12px var(--shadow);
}
.card h3 { margin-bottom:.4rem; color:var(--accent-2); }
.card p { font-size:.9rem; color:var(--text-muted); }

/* --------------------------------------------------------------
   Footer
   -------------------------------------------------------------- */
footer {
    margin-top:auto;
    padding:1rem;
    text-align:center;
    font-size:.85rem;
    color:var(--text-muted);
}
</style>
</head>
<body>

<div class="container" role="main">
    <header>
        <h1>Welcome to the Joyful Playground 🌈</h1>
        <p>Press the buttons, toggle the switch, or click a card – every interaction sparks a tiny animation.</p>
    </header>

    <!-- Buttons -->
    <section aria-label="Action buttons">
        <button class="button" id="confettiBtn">🎉 Celebrate!</button>
        <button class="button" id="colorBtn">🎨 Change Theme</button>
    </section>

    <!-- Dark‑mode toggle -->
    <section style="margin:1.5rem 0;" aria-label="Theme toggle">
        <label class="toggle" tabindex="0">
            <input type="checkbox" id="themeToggle" aria-label="Toggle dark mode">
            <span class="slider"></span>
        </label>
        <span style="margin-left:.8rem; vertical-align:middle;">Dark mode</span>
    </section>

    <!-- Interactive cards -->
    <section class="grid" aria-label="Fun cards">
        <div class="card" tabindex="0" data-msg="You found the hidden unicorn! 🦄">
            <h3>Unicorn</h3>
            <p>Click for a surprise.</p>
        </div>
        <div class="card" tabindex="0" data-msg="A friendly robot says hello! 🤖">
            <h3>Robot</h3>
            <p>Press me.</p>
        </div>
        <div class="card" tabindex="0" data-msg="You unlocked a rainbow! 🌈">
            <h3>Rainbow</h3>
            <p>Give it a tap.</p>
        </div>
        <div class="card" tabindex="0" data-msg="A tiny star twinkles ✨">
            <h3>Star</h3>
            <p>Try it.</p>
        </div>
    </section>
</div>

<footer>
    © 2024 Joyful Playground – pure HTML/CSS/JS, no external libs.
</footer>

<script>
/* --------------------------------------------------------------
   Utility: simple confetti effect (canvas‑free, DOM‑based)
   -------------------------------------------------------------- */
function launchConfetti() {
    const colors = ['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#5f27cd'];
    const confettiCount = 30;
    for(let i=0;i<confettiCount;i++){
        const div = document.createElement('div');
        div.style.position='fixed';
        div.style.left = Math.random()*100+'vw';
        div.style.top = '-10px';
        div.style.width='8px';
        div.style.height='8px';
        div.style.background=colors[Math.floor(Math.random()*colors.length)];
        div.style.borderRadius='50%';
        div.style.pointerEvents='none';
        div.style.zIndex='9999';
        div.style.transition=`transform 1.2s ease-out, opacity 1.2s`;
        document.body.appendChild(div);
        requestAnimationFrame(()=> {
            div.style.transform=`translateY(${window.innerHeight+20}px) rotate(${Math.random()*360}deg)`;
            div.style.opacity='0';
        });
        setTimeout(()=> div.remove(), 1300);
    }
}

/* --------------------------------------------------------------
   Theme handling – light/dark toggle + random pastel palette
   -------------------------------------------------------------- */
const root = document.documentElement;
function setDark(isDark){
    if(isDark){
        root.style.setProperty('--bg-primary','#2e3440');
        root.style.setProperty('--bg-accent','#3b4252');
        root.style.setProperty('--text-primary','#d8dee9');
        root.style.setProperty('--text-muted','#81a1c1');
    }else{
        root.style.setProperty('--bg-primary','#fdf6e3');
        root.style.setProperty('--bg-accent','#fff8e1');
        root.style.setProperty('--text-primary','#2e3440');
        root.style.setProperty('--text-muted','#5e81ac');
    }
}
document.getElementById('themeToggle').addEventListener('change', e=>{
    setDark(e.target.checked);
});

/* --------------------------------------------------------------
   Random pastel theme on button click
   -------------------------------------------------------------- */
function randomPastel(){
    const pastel = () => `hsl(${Math.random()*360},70%,85%)`;
    root.style.setProperty('--bg-primary', pastel());
    root.style.setProperty('--bg-accent', pastel());
    root.style.setProperty('--accent-1', pastel());
    root.style.setProperty('--accent-2', pastel());
    root.style.setProperty('--accent-3', pastel());
}

/* --------------------------------------------------------------
   Card interaction – show toast with data‑msg attribute
   -------------------------------------------------------------- */
function showToast(msg){
    const toast = document.createElement('div');
    toast.textContent = msg;
    toast.style.position='fixed';
    toast.style.bottom='2rem';
    toast.style.left='50%';
    toast.style.transform='translateX(-50%)';
    toast.style.background='rgba(0,0,0,0.75)';
    toast.style.color='#fff';
    toast.style.padding='0.8rem 1.2rem';
    toast.style.borderRadius='var(--radius)';
    toast.style.zIndex='10000';
    toast.style.opacity='0';
    toast.style.transition='opacity .3s';
    document.body.appendChild(toast);
    requestAnimationFrame(()=> toast.style.opacity='1');
    setTimeout(()=> {
        toast.style.opacity='0';
        toast.addEventListener('transitionend',()=> toast.remove());
    }, 2000);
}
document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click',()=> {
        const msg = card.dataset.msg || 'You clicked!';
        showToast(msg);
        card.animate([
            { transform:'scale(1)' },
            { transform:'scale(1.07)' },
            { transform:'scale(1)' }
        ], { duration:300, easing:'ease-out' });
    });
    // Keyboard accessibility – activate on Enter/Space
    card.addEventListener('keydown', e=>{
        if(e.key==='Enter' || e.key===' ') {
            e.preventDefault();
            card.click();
        }
    });
});

/* --------------------------------------------------------------
   Button actions
   -------------------------------------------------------------- */
document.getElementById('confettiBtn').addEventListener('click', launchConfetti);
document.getElementById('colorBtn').addEventListener('click', randomPastel);

/* --------------------------------------------------------------
   Initial accessibility tweaks
   -------------------------------------------------------------- */
document.querySelectorAll('button, .card, input').forEach(el=> {
    el.setAttribute('tabindex','0');
});
</script>
</body>
</html>
